<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trilha do Explorador 3D</title><link rel="stylesheet" href="style.css"><script src="https://cdn.babylonjs.com/babylon.js"></script></head><body>
<canvas id="renderCanvas"></canvas>
<header><div><b>TRILHA DO EXPLORADOR</b><small> ALPHA 3D · 0.3</small></div><button id="rules">REGRAS</button></header>
<section class="hud left"><h2>EXPLORADOR</h2><div class="chars"><button data-char="boy" class="active">🧑 ESCOTEIRO</button><button data-char="girl">👧 ESCOTEIRA</button></div><label>❤️ Energia <strong id="energy">5/10</strong></label><meter id="em" min="0" max="10" value="5"></meter><label>⚜ Experiência <strong id="xp">1/8</strong></label><meter id="xm" min="0" max="8" value="1"></meter><label>⭐ Conquistas <strong id="cq">0/10</strong></label><meter id="cm" min="0" max="10" value="0"></meter></section>
<section class="hud right"><h2>DADO D12</h2><div id="die">12</div><button id="roll" class="gold">ROLAR DADO</button><p>🥾 Movimentos: <b id="moves">0</b></p><button id="newGame">NOVA JORNADA</button><p class="hint">Casas alcançáveis brilham em verde. Arraste o cenário para girar a câmera.</p></section>
<div class="mission">🧭 <b>MISSÃO: EXPLORAR É SERVIR</b><span>Alcance o Marco da Trilha e retorne à Base.</span></div>
<div id="toast"></div><script src="game3d.js"></script></body></html>
